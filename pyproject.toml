[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ragdoc"
version = "0.1.0"
description = "Retrieval-augmented question answering over your documents, with hybrid search and verifiable citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krishna Goyal" }]
keywords = ["rag", "retrieval", "llm", "claude", "bm25", "semantic-search", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "pypdf>=4.0"]

[project.scripts]
ragdoc = "ragdoc.cli:main"

[project.urls]
Repository = "https://github.com/Krishna-44/rag-doc-assistant"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdoc"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
